<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>何て読む？ 図案クイズ道場</title>
<style>
  :root{
    --bg:#fef6e4;
    --card:#ffffff;
    --ink:#2b2b3a;
    --line:#e7dcc4;
    --hint:#f59e0b;
    --gotit:#16a34a;
    --answer:#2563eb;
    --explain:#7c3aed;
    --next:#0d9488;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,"Noto Sans JP",sans-serif;
    background:linear-gradient(160deg,#fef6e4 0%,#f7e9d0 100%);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:12px;
  }
  .app{width:100%;max-width:520px;}

  /* ===== タイトル ===== */
  .title-screen{
    background:var(--card);
    border-radius:22px;
    padding:28px 22px 32px;
    box-shadow:0 10px 30px rgba(120,90,40,.18);
    text-align:center;
    margin-top:14px;
  }
  .title-screen h1{
    font-size:clamp(26px,8vw,36px);
    margin:6px 0 4px;
    letter-spacing:1px;
  }
  .title-screen .sub{color:#8a7a58;font-size:15px;margin-bottom:18px;}
  .badges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px 0 22px;}
  .badge{background:#fdf0d5;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;color:#a9803a;}
  .opt{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 0 20px;font-size:15px;color:#6b6152;}
  .opt input{width:20px;height:20px;accent-color:var(--next);}

  /* TOP：評価で絞り込み */
  .filter{background:#fbf3df;border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 18px;}
  .filter-title{font-weight:800;color:#a9803a;font-size:14px;margin-bottom:10px;text-align:center;}
  .fgrid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
  .fchk{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-size:14px;font-weight:700;color:#6b6152;cursor:pointer;}
  .fchk input{width:18px;height:18px;accent-color:var(--next);}

  /* 問題の評価（答え表示後） */
  .ratebox{display:none;margin-top:12px;text-align:center;border-top:1px dashed var(--line);padding-top:12px;}
  .ratebox.show{display:block;}
  .ratebox p{margin:0 0 8px;font-weight:700;color:#6b6152;font-size:14px;}
  .ratebox .row{display:flex;gap:8px;justify-content:center;}
  .rbtn{flex:1;max-width:120px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:11px 6px;font-size:15px;font-weight:800;color:#6b6152;cursor:pointer;}
  .rbtn:active{transform:scale(.96);}
  .rbtn.sel{color:#fff;border-color:transparent;}
  #rateGood.sel{background:#16a34a;}
  #rateOk.sel{background:#f59e0b;}
  #rateBad.sel{background:#94a3b8;}
  .example{
    background:#fbf3df;border:1px dashed var(--line);border-radius:14px;
    padding:14px;margin:0 0 22px;font-size:14px;color:#7a6c4f;line-height:1.7;text-align:left;
  }

  /* ===== ゲーム画面 ===== */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--card);border-radius:16px;padding:10px 14px;
    box-shadow:0 4px 14px rgba(120,90,40,.12);margin-bottom:12px;
  }
  .qcount{font-weight:800;font-size:15px;color:#8a7a58;}
  .timer{font-weight:800;font-size:20px;padding:4px 12px;border-radius:999px;background:#eef8f3;color:#0d9488;min-width:96px;text-align:center;}
  .timer.warn{background:#fdecec;color:#dc2626;animation:pulse .8s infinite;}
  @keyframes pulse{50%{opacity:.5;}}

  .card{
    background:var(--card);border-radius:22px;
    box-shadow:0 10px 26px rgba(120,90,40,.15);
    padding:18px 16px 20px;
  }
  .qlabel{text-align:center;font-size:17px;font-weight:800;color:#b08536;margin:2px 0 8px;}
  .stagebox{
    display:flex;align-items:center;justify-content:center;
    min-height:230px;padding:6px;overflow:hidden;
    background:#fffdf8;border-radius:16px;border:1px solid #f2e8d2;
  }
  /* 図案を枠幅に合わせて自動縮小するラッパー */
  .artfit{
    display:inline-flex;align-items:center;justify-content:center;
    white-space:nowrap;transform-origin:center center;
  }

  /* 図案共通の文字サイズ（レスポンシブ） */
  .ch-xl{font-size:clamp(96px,34vw,150px);font-weight:800;line-height:1;}
  .ch-lg{font-size:clamp(78px,28vw,120px);font-weight:800;line-height:1;}
  .ch-md{font-size:clamp(46px,17vw,68px);font-weight:700;line-height:1;}

  /* ===== 表示ボックス（ヒント・答え・解説） ===== */
  .reveal{margin-top:14px;display:flex;flex-direction:column;gap:10px;}
  .box{border-radius:14px;padding:14px 16px;font-size:16px;line-height:1.6;display:none;}
  .box.show{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .box .tag{font-weight:800;font-size:13px;display:inline-block;margin-bottom:4px;}
  .box-hint{background:#fff6e6;border:1px solid #f6d998;}
  .box-hint .tag{color:var(--hint);}
  .box-answer{background:#eaf1ff;border:1px solid #bcd0ff;text-align:center;}
  .box-answer .tag{color:var(--answer);}
  .box-answer .ans{font-size:clamp(28px,9vw,40px);font-weight:900;color:var(--answer);letter-spacing:2px;}
  .box-explain{background:#f3ecff;border:1px solid #d8c6ff;}
  .box-explain .tag{color:var(--explain);}

  .selfcheck{display:none;margin-top:12px;text-align:center;}
  .selfcheck.show{display:block;}
  .selfcheck p{margin:0 0 8px;font-weight:700;color:#6b6152;}
  .selfcheck .row{display:flex;gap:10px;justify-content:center;}
  .sbtn{flex:1;max-width:150px;border:none;border-radius:12px;padding:12px;font-size:16px;font-weight:800;color:#fff;}
  .sbtn.ok{background:var(--gotit);}
  .sbtn.ng{background:#94a3b8;}

  /* ===== ボタン ===== */
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;}
  .btn{
    border:none;border-radius:14px;padding:15px 8px;font-size:16px;font-weight:800;color:#fff;
    cursor:pointer;transition:transform .06s,filter .15s;
  }
  .btn:active{transform:scale(.96);}
  .btn-hint{background:var(--hint);}
  .btn-gotit{background:var(--gotit);}
  .btn-answer{background:var(--answer);}
  .btn-explain{background:var(--explain);}
  .btn-next{background:var(--next);font-size:18px;padding:17px;}
  .btn-prev{background:#94a3b8;font-size:16px;}
  .btn.pulse{animation:bpulse 1s infinite;}
  @keyframes bpulse{50%{filter:brightness(1.18);box-shadow:0 0 0 4px rgba(37,99,235,.25);}}

  .primary{
    background:var(--next);color:#fff;border:none;border-radius:16px;
    padding:18px;font-size:20px;font-weight:800;width:100%;cursor:pointer;
    box-shadow:0 6px 16px rgba(13,148,136,.35);
  }
  .primary:active{transform:scale(.98);}

  .quitwrap{text-align:center;margin-top:14px;}
  .quit{background:none;border:none;color:#a89a7c;font-size:14px;text-decoration:underline;cursor:pointer;}

  /* ←Tommy-Go（ポータルへ戻る） */
  .topline{display:flex;justify-content:flex-start;margin:0 2px 10px;}
  .tommy-go{
    display:inline-flex;align-items:center;gap:4px;
    background:#fff;border:2px solid var(--next);color:var(--next);
    border-radius:999px;padding:9px 18px;font-size:15px;font-weight:800;
    text-decoration:none;box-shadow:0 3px 10px rgba(13,148,136,.2);
  }
  .tommy-go:active{transform:scale(.96);}

  /* ===== 結果 ===== */
  .result{background:var(--card);border-radius:22px;padding:30px 22px;text-align:center;box-shadow:0 10px 30px rgba(120,90,40,.18);margin-top:14px;}
  .result h2{font-size:26px;margin:0 0 6px;}
  .result .score{font-size:clamp(44px,14vw,64px);font-weight:900;color:var(--next);margin:10px 0;}
  .result .msg{color:#8a7a58;font-size:16px;margin-bottom:22px;}
</style>
</head>
<body>
<div class="app" id="app"></div>

/* ===================== 問題の評価（ブラウザに保存） ===================== */
const RATE_KEY = 'nazoRatings_v1';
let ratings = loadRatings();  // { 答えテキスト: 'good'|'ok'|'bad' }

function loadRatings(){
  try{ return JSON.parse(localStorage.getItem(RATE_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveRatings(){
  try{ localStorage.setItem(RATE_KEY, JSON.stringify(ratings)); }catch(e){}
}
function getRating(qIndex){ return ratings[QUESTIONS[qIndex].answer] || null; }
function setRating(qIndex, val){
  const key = QUESTIONS[qIndex].answer;
  if(ratings[key]===val){ delete ratings[key]; } // 同じものを再タップで解除
  else { ratings[key] = val; }
  saveRatings();
}
function ratingCounts(){
  const c = {good:0, ok:0, bad:0, none:0};
  QUESTIONS.forEach((q,i)=>{ const r=getRating(i)||'none'; c[r]++; });
  return c;
}

/* ===================== ゲーム開始 ===================== */
function startGame(shuffle, cats){
  // cats: null（＝すべて）または Set('good','ok','bad','none')
  let list = QUESTIONS.map((_,i)=>i);
  if(cats){
    list = list.filter(i=> cats.has(getRating(i) || 'none'));
  }
  if(list.length===0){
    alert('選んだ評価に当てはまる問題がありません。\n別の評価を選んでください。');
    return;
  }
  order = list;
  if(shuffle){
    for(let i=order.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [order[i],order[j]] = [order[j],order[i]];
    }
  }
  idx = 0;
  results = new Array(order.length).fill(null);
  showQuestion();
}

/* 図案を枠幅にぴったり収める（改行・見切れ防止） */
function fitArt(){
  const box = document.querySelector('.stagebox');
  const fit = document.getElementById('artfit');
  if(!box || !fit) return;
  fit.style.transform = 'none';
  const avail = box.clientWidth - 16;   // 左右パディング分の余白
  const natural = fit.scrollWidth;
  if(natural > avail && natural > 0){
    fit.style.transform = 'scale(' + (avail / natural) + ')';
  }
}

function toggle(id){
  document.getElementById(id).classList.toggle('show');
}

/* タイマー */
function startTimer(){
  clearInterval(timerId);
  const el = ()=>document.getElementById('timer');
  timerId = setInterval(()=>{
    timeLeft--;
    const t = el(); if(!t) return;
    t.textContent = `残り ${timeLeft}秒`;
    if(timeLeft<=10) t.classList.add('warn');
    if(timeLeft<=0){
      clearInterval(timerId);
      t.textContent = '⏰ 時間切れ！';
      showAnswer(true);
    }
  },1000);
}
function pauseTimer(){ clearInterval(timerId); }

/* わかった！ → タイマー停止＋答え確認をうながす */
function gotIt(){
  pauseTimer();
  const t = document.getElementById('timer');
  if(t && timeLeft>0){ t.textContent = `✋ ${timeLeft}秒で回答！`; }
  const ans = document.getElementById('btnAnswer');
  ans.classList.add('pulse');
  ans.textContent = '✅ 答えを確認';
}

/* 答え表示 → タイマー停止・自己採点を出す */
function showAnswer(timeup){
  pauseTimer();
  document.getElementById('boxAnswer').classList.add('show');
  document.getElementById('btnAnswer').classList.remove('pulse');
  if(results[idx]==null){
    document.getElementById('selfcheck').classList.add('show');
  }else{
    // すでに採点済み（前に戻ってきた場合など）→ 解説を表示
    document.getElementById('boxExplain').classList.add('show');
  }
  // 問題の評価（任意）を表示
  document.getElementById('ratebox').classList.add('show');
  refreshRateUI();
}

/* 問題の評価をつける（同じものを再タップで解除） */
function rateQuestion(val){
  setRating(order[idx], val);
  refreshRateUI();
}
function refreshRateUI(){
  const cur = getRating(order[idx]);
  ['rateGood','rateOk','rateBad'].forEach(id=>{
    const b = document.getElementById(id);
    if(b) b.classList.toggle('sel', b.dataset.v===cur);
  });
}

function selfScore(ok){
  results[idx] = ok;   // 上書き記録（前後に移動しても二重カウントしない）
  const sc = document.getElementById('selfcheck');
  sc.innerHTML = ok
    ? '<p style="color:#16a34a;font-size:18px;">🎉 正解！ すごい！</p>'
    : '<p style="color:#94a3b8;">つぎ、がんばろう！</p>';
  document.getElementById('boxExplain').classList.add('show');
  document.getElementById('btnNext').classList.add('pulse');
}

/* 次へ */
function next(){
  pauseTimer();
  if(idx+1<order.length){
    idx++;
    showQuestion();
    window.scrollTo(0,0);
  }else{
    finish();
  }
}

/* 前へ（誤って次へ進んだ時の戻り用） */
function prev(){
  pauseTimer();
  if(idx>0){
    idx--;
    showQuestion();
    window.scrollTo(0,0);
  }
}

function quit(){
  if(confirm('クイズをやめてタイトルに戻りますか？')){
    pauseTimer();
    renderTitle();
  }
}

/* 結果 */
function finish(){
  pauseTimer();
  const total = order.length;
  const answered = results.filter(r=>r===true).length;
  let msg = '';
  const rate = answered/total;
  if(rate===1) msg = 'パーフェクト！ 図案マスター！！';
  else if(rate>=0.7) msg = 'お見事！ かなりの読解力です。';
  else if(rate>=0.4) msg = 'いい調子！ もう一回チャレンジ！';
  else msg = 'なかなか手ごわい…もう一度どうぞ！';

  app.innerHTML = `
    <div class="result">
      <div style="font-size:46px;">🏁</div>
      <h2>おつかれさまでした！</h2>
      <div class="score">${answered} / ${total} 問</div>
      <div class="msg">${msg}</div>
      <button class="primary" id="againBtn">もう一度あそぶ</button>
      <div style="margin-top:16px;"><a class="tommy-go" href="${PORTAL_URL}">← Tommy-Go</a></div>
    </div>`;
  document.getElementById('againBtn').onclick = renderTitle;
}

/* 起動 */
window.addEventListener('resize', ()=>{ if(document.getElementById('artfit')) fitArt(); });
renderTitle();
</script>
</body>
</html>
