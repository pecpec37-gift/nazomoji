<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>何て読む？ 図案クイズ道場</title>
<style>
  :root{
    --bg:#fef6e4;
    --card:#ffffff;
    --ink:#2b2b3a;
    --line:#e7dcc4;
    --hint:#f59e0b;
    --gotit:#16a34a;
    --answer:#2563eb;
    --explain:#7c3aed;
    --next:#0d9488;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,"Noto Sans JP",sans-serif;
    background:linear-gradient(160deg,#fef6e4 0%,#f7e9d0 100%);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:12px;
  }
  .app{width:100%;max-width:520px;}

  /* ===== タイトル ===== */
  .title-screen{
    background:var(--card);
    border-radius:22px;
    padding:28px 22px 32px;
    box-shadow:0 10px 30px rgba(120,90,40,.18);
    text-align:center;
    margin-top:14px;
  }
  .title-screen h1{
    font-size:clamp(26px,8vw,36px);
    margin:6px 0 4px;
    letter-spacing:1px;
  }
  .title-screen .sub{color:#8a7a58;font-size:15px;margin-bottom:18px;}
  .badges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px 0 22px;}
  .badge{background:#fdf0d5;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;color:#a9803a;}
  .opt{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 0 20px;font-size:15px;color:#6b6152;}
  .opt input{width:20px;height:20px;accent-color:var(--next);}
  .example{
    background:#fbf3df;border:1px dashed var(--line);border-radius:14px;
    padding:14px;margin:0 0 22px;font-size:14px;color:#7a6c4f;line-height:1.7;text-align:left;
  }

  /* ===== ゲーム画面 ===== */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--card);border-radius:16px;padding:10px 14px;
    box-shadow:0 4px 14px rgba(120,90,40,.12);margin-bottom:12px;
  }
  .qcount{font-weight:800;font-size:15px;color:#8a7a58;}
  .timer{font-weight:800;font-size:20px;padding:4px 12px;border-radius:999px;background:#eef8f3;color:#0d9488;min-width:96px;text-align:center;}
  .timer.warn{background:#fdecec;color:#dc2626;animation:pulse .8s infinite;}
  @keyframes pulse{50%{opacity:.5;}}

  .card{
    background:var(--card);border-radius:22px;
    box-shadow:0 10px 26px rgba(120,90,40,.15);
    padding:18px 16px 20px;
  }
  .qlabel{text-align:center;font-size:17px;font-weight:800;color:#b08536;margin:2px 0 8px;}
  .stagebox{
    display:flex;align-items:center;justify-content:center;
    min-height:230px;padding:6px;overflow:hidden;
    background:#fffdf8;border-radius:16px;border:1px solid #f2e8d2;
  }

  /* 図案共通の文字サイズ（レスポンシブ） */
  .ch-xl{font-size:clamp(96px,34vw,150px);font-weight:800;line-height:1;}
  .ch-lg{font-size:clamp(78px,28vw,120px);font-weight:800;line-height:1;}
  .ch-md{font-size:clamp(46px,17vw,68px);font-weight:700;line-height:1;}

  /* ===== 表示ボックス（ヒント・答え・解説） ===== */
  .reveal{margin-top:14px;display:flex;flex-direction:column;gap:10px;}
  .box{border-radius:14px;padding:14px 16px;font-size:16px;line-height:1.6;display:none;}
  .box.show{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .box .tag{font-weight:800;font-size:13px;display:inline-block;margin-bottom:4px;}
  .box-hint{background:#fff6e6;border:1px solid #f6d998;}
  .box-hint .tag{color:var(--hint);}
  .box-answer{background:#eaf1ff;border:1px solid #bcd0ff;text-align:center;}
  .box-answer .tag{color:var(--answer);}
  .box-answer .ans{font-size:clamp(28px,9vw,40px);font-weight:900;color:var(--answer);letter-spacing:2px;}
  .box-explain{background:#f3ecff;border:1px solid #d8c6ff;}
  .box-explain .tag{color:var(--explain);}

  .selfcheck{display:none;margin-top:12px;text-align:center;}
  .selfcheck.show{display:block;}
  .selfcheck p{margin:0 0 8px;font-weight:700;color:#6b6152;}
  .selfcheck .row{display:flex;gap:10px;justify-content:center;}
  .sbtn{flex:1;max-width:150px;border:none;border-radius:12px;padding:12px;font-size:16px;font-weight:800;color:#fff;}
  .sbtn.ok{background:var(--gotit);}
  .sbtn.ng{background:#94a3b8;}

  /* ===== ボタン ===== */
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;}
  .btn{
    border:none;border-radius:14px;padding:15px 8px;font-size:16px;font-weight:800;color:#fff;
    cursor:pointer;transition:transform .06s,filter .15s;
  }
  .btn:active{transform:scale(.96);}
  .btn-hint{background:var(--hint);}
  .btn-gotit{background:var(--gotit);}
  .btn-answer{background:var(--answer);}
  .btn-explain{background:var(--explain);}
  .btn-next{background:var(--next);grid-column:1 / -1;font-size:18px;padding:17px;}
  .btn.pulse{animation:bpulse 1s infinite;}
  @keyframes bpulse{50%{filter:brightness(1.18);box-shadow:0 0 0 4px rgba(37,99,235,.25);}}

  .primary{
    background:var(--next);color:#fff;border:none;border-radius:16px;
    padding:18px;font-size:20px;font-weight:800;width:100%;cursor:pointer;
    box-shadow:0 6px 16px rgba(13,148,136,.35);
  }
  .primary:active{transform:scale(.98);}

  .quitwrap{text-align:center;margin-top:14px;}
  .quit{background:none;border:none;color:#a89a7c;font-size:14px;text-decoration:underline;cursor:pointer;}

  /* ←Tommy-Go（ポータルへ戻る） */
  .topline{display:flex;justify-content:flex-start;margin:0 2px 10px;}
  .tommy-go{
    display:inline-flex;align-items:center;gap:4px;
    background:#fff;border:2px solid var(--next);color:var(--next);
    border-radius:999px;padding:9px 18px;font-size:15px;font-weight:800;
    text-decoration:none;box-shadow:0 3px 10px rgba(13,148,136,.2);
  }
  .tommy-go:active{transform:scale(.96);}

  /* ===== 結果 ===== */
  .result{background:var(--card);border-radius:22px;padding:30px 22px;text-align:center;box-shadow:0 10px 30px rgba(120,90,40,.18);margin-top:14px;}
  .result h2{font-size:26px;margin:0 0 6px;}
  .result .score{font-size:clamp(44px,14vw,64px);font-weight:900;color:var(--next);margin:10px 0;}
  .result .msg{color:#8a7a58;font-size:16px;margin-bottom:22px;}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ===================== 問題データ ===================== */
/* art: 図案（見せる文字絵）のHTML。answer/hint/explanation は元エクセルの内容に準拠 */
const QUESTIONS = [
  {
    answer:"不良品",
    hint:"品に凸凹が含まれている",
    explanation:"品に凸凹（でこぼこ）が含まれている＝良くない品なので「不良品」",
    art:`
      <svg viewBox="0 0 260 220" width="100%" style="max-width:250px" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="bumpy" x="-25%" y="-25%" width="150%" height="150%">
            <feTurbulence type="turbulence" baseFrequency="0.045 0.06" numOctaves="2" seed="7" result="t"/>
            <feDisplacementMap in="SourceGraphic" in2="t" scale="18" xChannelSelector="R" yChannelSelector="G"/>
          </filter>
        </defs>
        <text x="130" y="168" text-anchor="middle" font-size="150" font-weight="800" fill="#334155"
              filter="url(#bumpy)" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">品</text>
        <text x="30" y="46" font-size="30" font-weight="800" fill="#ef4444">凸</text>
        <text x="200" y="204" font-size="30" font-weight="800" fill="#3b82f6">凹</text>
      </svg>`
  },
  {
    answer:"公私混同",
    hint:"私に似た字に公が含まれている",
    explanation:"私と公が混同（重なり合って）した文字なので「公私混同」",
    art:`
      <div style="position:relative;width:190px;height:190px;">
        <span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#2563eb;opacity:.78;transform:translate(-7px,-5px)" class="ch-xl">公</span>
        <span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#dc2626;opacity:.72;transform:translate(7px,5px)" class="ch-xl">私</span>
      </div>`
  },
  {
    answer:"音痴",
    hint:"何がずれている？",
    explanation:"「音」の字がずれている（＝音がずれている）から「音痴」",
    art:`
      <div style="display:flex;flex-direction:column;align-items:center;">
        <span class="ch-lg" style="color:#334155;transform:translateX(-28px) rotate(-6deg)">立</span>
        <span class="ch-lg" style="color:#334155;transform:translateX(28px) rotate(5deg);margin-top:-6px;">日</span>
      </div>`
  },
  {
    answer:"目薬",
    hint:"薬の漢字にある白が違っている",
    explanation:"「薬」の中の白の部分が目になっているので「目薬」",
    art:`
      <div style="position:relative;width:220px;height:210px;">
        <span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#334155;font-size:clamp(120px,42vw,175px);font-weight:800;line-height:1;">薬</span>
        <span style="position:absolute;top:26%;left:50%;transform:translateX(-50%);
              font-size:clamp(32px,11vw,46px);font-weight:800;color:#334155;
              background:#fffdf8;padding:0 2px;box-shadow:0 0 0 3px #fffdf8;">目</span>
      </div>`
  },
  {
    answer:"ポスター",
    hint:"☆を英語にすると・・・",
    explanation:"「ポ」の半濁音（゜）が星（スター）になっているので、ポ＋スター＝「ポスター」",
    art:`
      <div style="position:relative;display:inline-block;padding:10px 40px 0 0;">
        <span class="ch-xl" style="color:#334155;">ホ</span>
        <span style="position:absolute;top:-4px;right:0;font-size:clamp(46px,16vw,66px);color:#f59e0b;">☆</span>
      </div>`
  },
  {
    answer:"ワン切り",
    hint:"１が切れている",
    explanation:"「１（ワン）」が切れているので「ワン切り」",
    art:`
      <div style="position:relative;width:clamp(90px,30vw,120px);height:clamp(160px,52vw,210px);">
        <span style="position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(130px,44vw,185px);font-weight:900;color:#334155;clip-path:inset(0 0 55% 0);transform:translateX(-9px)">1</span>
        <span style="position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(130px,44vw,185px);font-weight:900;color:#334155;clip-path:inset(52% 0 0 0);transform:translateX(9px)">1</span>
        <span style="position:absolute;top:43%;left:-10px;font-size:clamp(24px,9vw,36px);transform:rotate(14deg)">✂️</span>
      </div>`
  },
  {
    answer:"伊豆大島",
    hint:"ＩＳの文字が大きい",
    explanation:"ＩＳが大きい ＩＳＬＡＮＤ（島）→ 伊豆（ＩＳ）＋大きい＋島 で「伊豆大島」",
    art:`
      <div style="display:flex;align-items:center;white-space:nowrap;font-weight:900;letter-spacing:-2px;">
        <span style="font-size:clamp(72px,25vw,112px);color:#2563eb;">ＩＳ</span>
        <span style="font-size:clamp(32px,11vw,52px);color:#334155;">ＬＡＮＤ</span>
      </div>`
  },
  {
    answer:"ダイエット",
    hint:"エの文字が大きい",
    explanation:"大きい「エ」＝“ダイ”な「エ」＋「ット」で「ダイエット」",
    art:`
      <div style="display:flex;align-items:center;gap:2px;font-weight:800;color:#334155;">
        <span style="font-size:clamp(100px,36vw,144px);color:#dc2626;">エ</span>
        <span style="font-size:clamp(48px,17vw,68px);">ット</span>
      </div>`
  },
  {
    answer:"イラストレーター",
    hint:"イの文字が最後にある",
    explanation:"「イ」がラスト（最後）にある → イ・ラスト・レーター で「イラストレーター」",
    art:`
      <div style="display:flex;align-items:center;font-weight:800;color:#334155;font-size:clamp(40px,13vw,60px);letter-spacing:2px;">
        <span>レーター</span>
        <span style="color:#dc2626;text-decoration:underline;text-underline-offset:6px;">イ</span>
      </div>`
  },
  {
    answer:"パンダ",
    hint:"＆をローマ字にすると・・・",
    explanation:"Ｐ＿ＡＮＤ＿Ａ をつなげると ＰＡＮＤＡ になるので「パンダ」",
    art:`
      <div style="font-weight:900;color:#334155;font-size:clamp(80px,28vw,120px);letter-spacing:4px;">
        Ｐ<span style="color:#dc2626;">＆</span>Ａ
      </div>`
  },
  {
    answer:"ハムスター",
    hint:"可愛い動物",
    explanation:"公（ハム）＋星（スター）で「ハムスター」",
    art:`
      <div class="ch-xl" style="font-weight:900;color:#334155;">公星</div>`
  }
];

/* ===================== 状態 ===================== */
const PORTAL_URL = "https://pecpec37-gift.github.io/portal/";
const TIME_LIMIT = 60;
let order = [];
let idx = 0;
let timeLeft = TIME_LIMIT;
let timerId = null;
let answered = 0;   // 自己申告の正解数
let scored = false; // その問で自己採点済みか

const app = document.getElementById('app');

/* ===================== タイトル ===================== */
function renderTitle(){
  clearInterval(timerId);
  app.innerHTML = `
    <div class="topline"><a class="tommy-go" href="${PORTAL_URL}">← Tommy-Go</a></div>
    <div class="title-screen">
      <div style="font-size:44px;">🧩</div>
      <h1>何て読む？<br>図案クイズ道場</h1>
      <div class="sub">加工された文字、何て読む？</div>
      <div class="badges">
        <span class="badge">全${QUESTIONS.length}問</span>
        <span class="badge">制限時間 60秒</span>
        <span class="badge">ヒントあり</span>
      </div>
      <div class="example">
        <b>遊び方</b><br>
        画面に出てくる「加工された文字」を見て、何と読むか当ててね。<br>
        わからなければ「ヒント」、当てたら「わかった！」、答え合わせは「答え」＆「解説」で！
      </div>
      <label class="opt">
        <input type="checkbox" id="shuffleChk" checked>
        問題をランダムに出す
      </label>
      <button class="primary" id="startBtn">スタート</button>
    </div>`;
  document.getElementById('startBtn').onclick = ()=>{
    const shuffle = document.getElementById('shuffleChk').checked;
    startGame(shuffle);
  };
}

/* ===================== ゲーム開始 ===================== */
function startGame(shuffle){
  order = QUESTIONS.map((_,i)=>i);
  if(shuffle){
    for(let i=order.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [order[i],order[j]] = [order[j],order[i]];
    }
  }
  idx = 0;
  answered = 0;
  showQuestion();
}

/* ===================== 問題表示 ===================== */
function showQuestion(){
  scored = false;
  const q = QUESTIONS[order[idx]];
  timeLeft = TIME_LIMIT;

  app.innerHTML = `
    <div class="topbar">
      <span class="qcount">第 ${idx+1} 問 / 全 ${QUESTIONS.length} 問</span>
      <span class="timer" id="timer">残り ${timeLeft}秒</span>
    </div>
    <div class="card">
      <div class="qlabel">何て読むでしょうか？</div>
      <div class="stagebox">${q.art}</div>

      <div class="reveal">
        <div class="box box-hint" id="boxHint"><span class="tag">💡 ヒント</span><br>${q.hint}</div>
        <div class="box box-answer" id="boxAnswer"><span class="tag">✅ 答え</span><br><span class="ans">${q.answer}</span></div>
        <div class="box box-explain" id="boxExplain"><span class="tag">📖 解説</span><br>${q.explanation}</div>
      </div>

      <div class="selfcheck" id="selfcheck">
        <p>正解できた？</p>
        <div class="row">
          <button class="sbtn ok" id="selfOk">できた ○</button>
          <button class="sbtn ng" id="selfNg">ざんねん ×</button>
        </div>
      </div>

      <div class="btns">
        <button class="btn btn-hint"    id="btnHint">💡 ヒント</button>
        <button class="btn btn-gotit"   id="btnGotit">🙋 わかった！</button>
        <button class="btn btn-answer"  id="btnAnswer">✅ 答え</button>
        <button class="btn btn-explain" id="btnExplain">📖 解説</button>
        <button class="btn btn-next"    id="btnNext">${idx+1<QUESTIONS.length?'▶ 次の問題':'🏁 結果を見る'}</button>
      </div>
    </div>
    <div class="quitwrap"><button class="quit" id="btnQuit">やめる（タイトルへ）</button></div>
  `;

  document.getElementById('btnHint').onclick    = ()=>toggle('boxHint');
  document.getElementById('btnGotit').onclick   = gotIt;
  document.getElementById('btnAnswer').onclick  = showAnswer;
  document.getElementById('btnExplain').onclick = ()=>toggle('boxExplain');
  document.getElementById('btnNext').onclick    = next;
  document.getElementById('btnQuit').onclick    = quit;
  document.getElementById('selfOk').onclick     = ()=>selfScore(true);
  document.getElementById('selfNg').onclick     = ()=>selfScore(false);

  startTimer();
}

function toggle(id){
  document.getElementById(id).classList.toggle('show');
}

/* タイマー */
function startTimer(){
  clearInterval(timerId);
  const el = ()=>document.getElementById('timer');
  timerId = setInterval(()=>{
    timeLeft--;
    const t = el(); if(!t) return;
    t.textContent = `残り ${timeLeft}秒`;
    if(timeLeft<=10) t.classList.add('warn');
    if(timeLeft<=0){
      clearInterval(timerId);
      t.textContent = '⏰ 時間切れ！';
      showAnswer(true);
    }
  },1000);
}
function pauseTimer(){ clearInterval(timerId); }

/* わかった！ → タイマー停止＋答え確認をうながす */
function gotIt(){
  pauseTimer();
  const t = document.getElementById('timer');
  if(t && timeLeft>0){ t.textContent = `✋ ${timeLeft}秒で回答！`; }
  const ans = document.getElementById('btnAnswer');
  ans.classList.add('pulse');
  ans.textContent = '✅ 答えを確認';
}

/* 答え表示 → タイマー停止・自己採点を出す */
function showAnswer(timeup){
  pauseTimer();
  document.getElementById('boxAnswer').classList.add('show');
  document.getElementById('btnAnswer').classList.remove('pulse');
  if(!scored){
    document.getElementById('selfcheck').classList.add('show');
  }
}

function selfScore(ok){
  if(scored) return;
  scored = true;
  if(ok) answered++;
  const sc = document.getElementById('selfcheck');
  sc.innerHTML = ok
    ? '<p style="color:#16a34a;font-size:18px;">🎉 正解！ すごい！</p>'
    : '<p style="color:#94a3b8;">つぎ、がんばろう！</p>';
  document.getElementById('boxExplain').classList.add('show');
  document.getElementById('btnNext').classList.add('pulse');
}

/* 次へ */
function next(){
  pauseTimer();
  if(idx+1<QUESTIONS.length){
    idx++;
    showQuestion();
    window.scrollTo(0,0);
  }else{
    finish();
  }
}

function quit(){
  if(confirm('クイズをやめてタイトルに戻りますか？')){
    pauseTimer();
    renderTitle();
  }
}

/* 結果 */
function finish(){
  pauseTimer();
  const total = QUESTIONS.length;
  let msg = '';
  const rate = answered/total;
  if(rate===1) msg = 'パーフェクト！ 図案マスター！！';
  else if(rate>=0.7) msg = 'お見事！ かなりの読解力です。';
  else if(rate>=0.4) msg = 'いい調子！ もう一回チャレンジ！';
  else msg = 'なかなか手ごわい…もう一度どうぞ！';

  app.innerHTML = `
    <div class="result">
      <div style="font-size:46px;">🏁</div>
      <h2>おつかれさまでした！</h2>
      <div class="score">${answered} / ${total} 問</div>
      <div class="msg">${msg}</div>
      <button class="primary" id="againBtn">もう一度あそぶ</button>
      <div style="margin-top:16px;"><a class="tommy-go" href="${PORTAL_URL}">← Tommy-Go</a></div>
    </div>`;
  document.getElementById('againBtn').onclick = renderTitle;
}

/* 起動 */
renderTitle();
</script>
</body>
</html>
